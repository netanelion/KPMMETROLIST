name: Aurora Build

# Compiles the Aurora redesign on GitHub-hosted runners and publishes an
# installable debug APK as a workflow artifact.
on:
  workflow_dispatch:
  push:
    branches:
      - "ccr-*"
    paths-ignore:
      - "README.md"
      - "fastlane/**"
      - "assets/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Aurora APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/aurora-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Metrolist Aurora,O=Metrolist,C=US"

      - name: Build FOSS Debug APK
        run: ./gradlew --console=plain assembleFossDebug --warning-mode summary
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          METROLIST_APPLICATION_ID: com.metrolist.music.aurora
          METROLIST_APP_NAME: Metrolist Aurora
          METROLIST_DEBUG_KEYSTORE_PATH: aurora-debug.keystore
          PULL_REQUEST: "false"

      - name: Run unit tests (playback, cipher, parsers, app)
        run: ./gradlew --console=plain :innertube:testDebugUnitTest :app:testFossDebugUnitTest --warning-mode summary
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          METROLIST_APPLICATION_ID: com.metrolist.music.aurora
          METROLIST_APP_NAME: Metrolist Aurora
          METROLIST_DEBUG_KEYSTORE_PATH: aurora-debug.keystore
          PULL_REQUEST: "false"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: metrolist-aurora-debug
          path: app/build/outputs/apk/foss/debug/*.apk
